<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudio de Moda ✦ Juego de vestir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff5fa2;--purple:#7b4dff;--ink:#3a2350}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);min-height:100vh;
  background:radial-gradient(circle at 15% 10%,#ffd6ec 0,transparent 40%),radial-gradient(circle at 90% 85%,#d9ccff 0,transparent 45%),linear-gradient(135deg,#ff9ccc,#a98bff)}
body:before{content:'';position:fixed;inset:0;background-image:radial-gradient(#ffffff66 2px,transparent 2.5px);background-size:26px 26px;pointer-events:none;z-index:0}
header{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1180px;margin:0 auto;padding:14px 16px}
.logo{font-size:30px;font-weight:700;color:#fff;text-shadow:0 3px 0 #c43c86,0 6px 14px #0003;letter-spacing:.5px;line-height:1}
.logo small{display:block;font-size:13px;font-weight:500;text-shadow:none;opacity:.95;letter-spacing:0;margin-top:4px}
.game{position:relative;z-index:1;display:grid;grid-template-columns:minmax(300px,430px) 1fr;gap:20px;max-width:1180px;margin:0 auto;padding:0 16px 30px;align-items:start}
.stage{background:#fff;border:6px solid #fff;border-radius:28px;box-shadow:0 10px 0 #c25599,0 18px 30px #0003;overflow:hidden;position:sticky;top:12px}
#stage svg{display:block;width:100%;height:auto}
.btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px 8px 14px;background:linear-gradient(#fff,#fbe9f6)}
.b{font:inherit;font-weight:600;font-size:14px;border:0;border-radius:16px;padding:9px 13px;cursor:pointer;color:#fff;background:linear-gradient(#ff8cc2,#ff4f9a);box-shadow:0 4px 0 #c22f74;transition:transform .08s,box-shadow .08s;white-space:nowrap}
.b:active{transform:translateY(3px);box-shadow:0 1px 0 #c22f74}
.b.v{background:linear-gradient(#a58bff,#7b4dff);box-shadow:0 4px 0 #5130c2}
.b.y{background:linear-gradient(#ffe07a,#ffb21e);box-shadow:0 4px 0 #c98400;color:#5a3a00}
.b.g{background:linear-gradient(#7ae6bd,#22b884);box-shadow:0 4px 0 #148a61}
.b.w{background:#fff;color:#7b4dff;box-shadow:0 4px 0 #d9c9ff}
.panel{background:#fff;border-radius:28px;box-shadow:0 10px 0 #6b45c9,0 18px 30px #0003;display:flex;flex-direction:column;overflow:hidden;height:calc(100vh - 110px);min-height:560px}
.tabs{display:flex;gap:7px;padding:10px;overflow-x:auto;background:linear-gradient(#f4ecff,#fff);border-bottom:3px dashed #eadcff;scrollbar-width:thin}
.tab{flex:0 0 auto;border:0;background:#fff;border-radius:16px;padding:7px 8px 6px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:#7a5aa8;box-shadow:0 3px 0 #e3d4fb;min-width:70px;transition:transform .1s}
.tab:hover{transform:translateY(-2px)}
.tab span{font-size:25px;line-height:1}
.tab.on{background:linear-gradient(#ff8cc2,#ff5fa2);color:#fff;box-shadow:0 3px 0 #c22f74}
.pbody{padding:14px 16px;overflow:auto;flex:1}
.ttl{font-size:21px;font-weight:700;margin:0 0 10px;color:#ff4f9a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.item{position:relative;border:3px solid #f1e6ff;background:linear-gradient(#fff,#faf5ff);border-radius:18px;padding:6px 4px;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .12s,border-color .12s}
.item:hover{transform:translateY(-3px) rotate(-1deg);border-color:#ffb3d6}
.item.on{border-color:#ff5fa2;background:linear-gradient(#fff0f7,#ffe1f0);box-shadow:0 0 0 3px #ffd0e6}
.item.on:after{content:'✓';position:absolute;top:4px;right:6px;background:#ff5fa2;color:#fff;border-radius:50%;width:20px;height:20px;font-size:13px;display:grid;place-items:center}
.item svg{width:100%;height:100px}
.item small{font-size:12.5px;font-weight:600;text-align:center;line-height:1.1;min-height:28px;display:flex;align-items:center}
h3{margin:16px 0 8px;font-size:15px;color:#7b4dff}
h3:first-child{margin-top:0}
.sw{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.sw button{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e6dafa;cursor:pointer;padding:0;transition:transform .1s}
.sw button:hover{transform:scale(1.12)}
.sw button.on{box-shadow:0 0 0 3px #ff5fa2}
.sw label{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:#9a7cc4;cursor:pointer}
input[type=color]{width:40px;height:34px;border:0;background:none;cursor:pointer;padding:0}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{border:0;font:inherit;font-weight:600;font-size:13.5px;padding:7px 12px;border-radius:14px;background:#f3ecff;color:#6a4aa0;cursor:pointer;box-shadow:0 3px 0 #e1d3fa}
.opt.on{background:linear-gradient(#a58bff,#7b4dff);color:#fff;box-shadow:0 3px 0 #5130c2}
input[type=range]{width:100%;accent-color:#ff5fa2}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cbar{border-top:3px dashed #ffd6ea;padding:10px 16px 14px;background:#fff8fc}
.cbar .lbl{font-weight:700;font-size:14px;margin-bottom:6px;color:#c22f74;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;font:inherit;font-size:12px;font-weight:600;padding:4px 10px;border-radius:12px;background:#ffe3f0;color:#c22f74;cursor:pointer}
.chip.on{background:#ff5fa2;color:#fff}
.pats{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pats button{width:40px;height:30px;border-radius:10px;border:2px solid #f1e6ff;cursor:pointer;padding:0;overflow:hidden;background:#fff}
.pats button.on{border-color:#ff5fa2;box-shadow:0 0 0 2px #ffd0e6}
.pats svg{width:100%;height:100%;display:block}
.hint{background:#f6f0ff;border-radius:14px;padding:10px 12px;font-size:14px;color:#6a4aa0;line-height:1.35}
.photo-wrap{position:relative;border-radius:18px;overflow:hidden;background:#f6f0ff;border:3px dashed #d9c9ff;min-height:160px;display:grid;place-items:center}
.photo-wrap canvas{max-width:100%;display:block;cursor:crosshair}
.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.look{border:3px solid #f1e6ff;border-radius:18px;padding:6px;background:#fff;text-align:center}
.look svg{width:100%;height:170px;display:block;border-radius:12px}
.look .acts{display:flex;gap:4px;justify-content:center;margin-top:6px}
.look .acts button{font:inherit;font-size:12px;border:0;border-radius:10px;padding:4px 8px;cursor:pointer;background:#f3ecff;color:#6a4aa0;font-weight:600}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:#3a2350;color:#fff;padding:12px 18px;border-radius:16px;font-weight:600;z-index:10;transition:transform .3s;box-shadow:0 8px 20px #0004}
.toast.show{transform:translateX(-50%) translateY(0)}
/* animaciones del personaje */
.breathe{animation:breathe 4.5s ease-in-out infinite;transform-origin:200px 810px}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.006)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.015)}100%{transform:scale(1)}}
@media (max-width:860px){
  .game{grid-template-columns:1fr}
  .stage{position:relative;top:0;max-width:430px;width:100%;margin:0 auto}
  .panel{height:auto;min-height:0}
  .pbody{max-height:none}
  .logo{font-size:24px}
}
</style>
</head>
<body>
<header>
  <div class="logo">✦ Estudio de Moda ✦</div>
  <button class="b w" id="mute" title="Sonido">🔊</button>
</header>

<main class="game">
  <section class="stage">
    <div id="stage"></div>
    <div class="btns">
      <button class="b y" id="bRand"> Look Aleatorio</button>
      <button class="b v" id="bUndo">↩ Deshacer</button>
      <button class="b w" id="bClear">🧺 Quitar ropa</button>
      <button class="b g" id="bPng">Guardar una foto</button>
      <button class="b" id="bSave">Guardar look</button>
      <button class="b v" id="bShare">Copiar enlace</button>
    </div>
  </section>
  <section class="panel">
    <nav class="tabs" id="tabs"></nav>
    <div class="pbody" id="pbody"></div>
    <div class="cbar" id="cbar" hidden></div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   UTILIDADES DE COLOR Y DIBUJO
   ========================================================= */
const hex2rgb=h=>{h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]};
const rgb2hex=(r,g,b)=>'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const A=hex2rgb(a),B=hex2rgb(b);return rgb2hex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t)};
const dk=(c,t=.25)=>mix(c,'#1d0d22',t);
const lt=(c,t=.25)=>mix(c,'#ffffff',t);
const lum=c=>{const[r,g,b]=hex2rgb(c);return(.299*r+.587*g+.114*b)/255};

/* Convierte la mitad izquierda de una figura (de x=200 a x=200) en la figura completa simétrica */
function F(d){
  const re=/([MLCQ])([^MLCQZ]*)/gi;let m,segs=[],start=null,cur=null;
  while((m=re.exec(d))){
    const c=m[1].toUpperCase();const n=(m[2].match(/-?\d*\.?\d+/g)||[]).map(Number);
    if(c==='M'){start=[n[0],n[1]];cur=start}
    else if(c==='L'){segs.push({c,f:cur,p:[],t:[n[0],n[1]]});cur=[n[0],n[1]]}
    else if(c==='C'){segs.push({c,f:cur,p:[[n[0],n[1]],[n[2],n[3]]],t:[n[4],n[5]]});cur=[n[4],n[5]]}
    else if(c==='Q'){segs.push({c,f:cur,p:[[n[0],n[1]]],t:[n[2],n[3]]});cur=[n[2],n[3]]}
  }
  const mx=p=>[400-p[0],p[1]],f=p=>+p[0].toFixed(2)+','+ +p[1].toFixed(2);
  let o='M'+f(start);
  segs.forEach(s=>{o+=s.c+[...s.p,s.t].map(f).join(' ')});
  for(let i=segs.length-1;i>=0;i--){const s=segs[i];o+=s.c+[...s.p.slice().reverse().map(mx),mx(s.f)].map(f).join(' ')}
  return o+'Z';
}
const pair=s=>s+`<g transform="matrix(-1 0 0 1 400 0)">${s}</g>`;
const ln=(d,c,w=1.5,o=1)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" opacity="${o}"/>`;
const pth=(d,fill,o=1,extra='')=>`<path d="${d}" fill="${fill}"${o<1?` opacity="${o}"`:''} ${extra}/>`;

/* Registro de degradados (dan el efecto 3D tipo avatar) */
class Reg{
  constructor(id){this.id=id;this.m=new Map()}
  g(t,c){const k=`${this.id}-${t}${c.replace('#','')}`;if(!this.m.has(k))this.m.set(k,this.mk(t,c,k));return`url(#${k})`}
  h(c){return this.g('h',c)} v(c){return this.g('v',c)} r(c){return this.g('r',c)} f(c){return this.g('f',c)} hv(c){return this.g('x',c)}
  mk(t,c,k){
    if(t==='h')return`<linearGradient id="${k}" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="${dk(c,.3)}"/><stop offset=".26" stop-color="${c}"/><stop offset=".52" stop-color="${lt(c,.14)}"/><stop offset=".78" stop-color="${c}"/><stop offset="1" stop-color="${dk(c,.32)}"/></linearGradient>`;
    if(t==='v')return`<linearGradient id="${k}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${lt(c,.18)}"/><stop offset=".45" stop-color="${c}"/><stop offset="1" stop-color="${dk(c,.28)}"/></linearGradient>`;
    if(t==='x')return`<linearGradient id="${k}" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="${lt(c,.25)}"/><stop offset=".5" stop-color="${c}"/><stop offset="1" stop-color="${dk(c,.3)}"/></linearGradient>`;
    if(t==='r')return`<radialGradient id="${k}" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="${lt(c,.3)}"/><stop offset=".55" stop-color="${c}"/><stop offset="1" stop-color="${dk(c,.3)}"/></radialGradient>`;
    if(t==='f')return`<radialGradient id="${k}" cx=".5" cy=".42" r=".62"><stop offset="0" stop-color="${lt(c,.16)}"/><stop offset=".6" stop-color="${c}"/><stop offset="1" stop-color="${dk(c,.2)}"/></radialGradient>`;
  }
  defs(){return[...this.m.values()].join('')}
}
const fab=(d,c,R,p,g='h')=>pth(d,R[g](c))+(p&&p!=='none'?pth(d,`url(#${R.id}-p-${p})`):'');

/* Estampados */
const PATS={
  none:'Liso',
  dots:'Lunares',
  rayas:'Rayas',
  cuadros:'Cuadros',
  flores:'Flores',
  brillos:'Brillos',
  leopardo:'Animal'
};
function patDefs(id){
  const fl=(x,y)=>`<g transform="translate(${x} ${y})" opacity=".85">${[0,72,144,216,288].map(a=>`<circle cx="${(4*Math.cos(a*Math.PI/180)).toFixed(2)}" cy="${(4*Math.sin(a*Math.PI/180)).toFixed(2)}" r="3" fill="#fff"/>`).join('')}<circle r="2.2" fill="#ffd34d"/></g>`;
  const st=(x,y,s)=>`<path transform="translate(${x} ${y}) scale(${s})" d="M0,-5 L1.2,-1.2 L5,0 L1.2,1.2 L0,5 L-1.2,1.2 L-5,0 L-1.2,-1.2Z" fill="#fff" opacity=".9"/>`;
  return`<pattern id="${id}-p-dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="2.4" fill="#fff" opacity=".85"/><circle cx="11" cy="11" r="2.4" fill="#fff" opacity=".85"/></pattern>
  <pattern id="${id}-p-rayas" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="5" fill="#fff" opacity=".5"/></pattern>
  <pattern id="${id}-p-cuadros" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="7" fill="#000" opacity=".17"/><rect width="7" height="20" fill="#000" opacity=".17"/><rect x="13" width="1.4" height="20" fill="#fff" opacity=".45"/><rect y="13" width="20" height="1.4" fill="#fff" opacity=".45"/></pattern>
  <pattern id="${id}-p-flores" width="30" height="30" patternUnits="userSpaceOnUse">${fl(8,8)}${fl(23,22)}</pattern>
  <pattern id="${id}-p-brillos" width="22" height="22" patternUnits="userSpaceOnUse">${st(5,5,.7)}${st(16,15,.5)}<circle cx="16" cy="4" r=".9" fill="#fff"/><circle cx="4" cy="17" r=".9" fill="#fff"/></pattern>
  <pattern id="${id}-p-leopardo" width="28" height="28" patternUnits="userSpaceOnUse"><g fill="none" stroke="#1d0d22" stroke-width="2.2" opacity=".45" stroke-linecap="round"><path d="M4,6 q4,-4 8,0 M6,12 q-3,-2 -2,-6"/><path d="M18,18 q4,-4 8,0 M20,24 q-3,-2 -2,-6"/></g><g fill="#1d0d22" opacity=".18"><ellipse cx="8" cy="8" rx="3" ry="2.2"/><ellipse cx="22" cy="20" rx="3" ry="2.2"/></g></pattern>`;
}
function staticDefs(id){
  return patDefs(id)+`<filter id="${id}-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="${id}-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.4"/></filter>`;
}
const bow=(x,y,c,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><path d="M0,0 L-11,-7 Q-14,0 -11,7Z M0,0 L11,-7 Q14,0 11,7Z" fill="${c}"/><path d="M0,0 L-11,-7 Q-14,0 -11,7Z M0,0 L11,-7 Q14,0 11,7Z" fill="#000" opacity=".08"/><circle r="3.4" fill="${dk(c,.15)}"/><path d="M-2,2 L-5,11 M2,2 L5,11" stroke="${c}" stroke-width="2.6" stroke-linecap="round"/></g>`;

/* =========================================================
   CUERPO Y ROSTRO
   ========================================================= */
const BODY={
  torso:F('M200,195 L183,195 L183,232 C183,242 172,246 160,249 C146,253 138,262 138,276 L144,300 C146,330 158,362 163,392 C164,412 150,432 149,456 C148,474 160,490 200,496'),
  leg:'M150,452 C146,500 152,560 160,612 C158,650 156,690 166,760 L170,778 L186,778 L186,760 C190,700 192,660 186,616 C192,575 200,530 200,490 Z',
  foot:'M168,764 C165,782 163,795 169,802 Q178,806 189,802 C194,795 191,781 186,764 Z',
  arm:'M146,261 C129,261 122,276 120,296 C117,330 115,352 113,382 C109,420 105,446 105,470 L124,472 C126,446 132,420 135,384 C139,350 147,330 151,300 Z',
  hand:'M105,466 C99,478 98,494 101,506 C103,516 108,523 114,523 C120,523 124,515 124,505 C125,494 127,482 124,468 Z',
  ear:'M139,138 C128,134 124,152 128,165 C131,173 137,174 141,169 Z'
};
const FACES={
  ovalada:'M200,62 C168,62 140,82 138,118 C136,145 138,168 148,188 C160,208 180,222 200,224',
  redonda:'M200,64 C164,64 134,86 134,124 C134,156 140,182 156,202 C170,216 186,222 200,222',
  corazon:'M200,62 C164,62 134,82 134,116 C134,142 142,166 156,186 C172,206 188,222 200,226',
  cuadrada:'M200,62 C166,62 138,82 137,116 C136,148 138,176 146,196 C156,212 180,220 200,221'
};
function bodyBase(S,R,o={}){
  const sk=S.skin,sd=dk(sk,.2);
  let s='';
  s+=pair(pth(BODY.leg,R.h(sk))+ln('M168,606 Q174,612 182,608',sd,1.4,.35)+(o.feet?pth(BODY.foot,R.v(sk))+ln('M172,798 L172,802 M178,800 L178,804 M184,798 L184,802',sd,1,.35):''));
  s+=pth(BODY.torso,R.h(sk));
  // sombra del cuello
  s+=pth(F('M200,222 C190,222 182,216 180,206 L180,222 C186,234 194,240 200,240'),sd,.45);
  s+=pair(ln('M170,253 Q182,259 193,255',sd,1.6,.35));
  s+=`<ellipse cx="200" cy="432" rx="2.2" ry="3.2" fill="${sd}" opacity=".5"/>`;
  // ropa interior base
  const u=o.ghost?'#ddd3ea':'#f4e1ea';
  s+=pth(F('M200,304 C190,298 176,296 162,298 L145,302 C148,318 152,334 156,348 Q178,352 200,352'),R.h(u));
  s+=pth(F('M200,404 L163,400 C160,420 152,440 150,458 C150,470 151,478 153,486 L194,500 C197,497 199,496 200,496'),R.h(u));
  return s;
}
function arms(S,R){const sk=S.skin;return pair(pth(BODY.arm,R.h(sk))+pth(BODY.hand,R.h(sk))+ln('M123,480 C129,486 130,496 125,502',dk(sk,.22),1.3,.5)+ln('M108,506 L108,514 M113,508 L113,517 M118,507 L118,515',dk(sk,.22),1,.35)+ln('M114,380 Q120,384 126,382',dk(sk,.2),1.2,.3))}

function eyes(S,R,anim){
  const s=S.eyeSize||1;let out='';
  const shp={almendra:{w:14,h:9.5,lift:2.5,ir:7.2},redondos:{w:13,h:11.5,lift:.5,ir:7.8},rasgados:{w:15,h:7.6,lift:5,ir:6.8},grandes:{w:15,h:12,lift:2,ir:8.4}}[S.eyes]||{w:14,h:9.5,lift:2.5,ir:7.2};
  const {w,h,lift,ir}=shp;
  [-1,1].forEach((side,i)=>{
    const cx=200+side*28,cy=150;
    const P=(x,y)=>`${(cx+side*x*s).toFixed(2)},${(cy+y*s).toFixed(2)}`;
    const shape=`M${P(-w,1)} C${P(-w*.4,-h*1.3)} ${P(w*.5,-h*1.25-lift*.4)} ${P(w,-lift)} C${P(w*.45,h*1.05)} ${P(-w*.5,h*.95)} ${P(-w,1)}Z`;
    const lid=`M${P(-w,1)} C${P(-w*.4,-h*1.3)} ${P(w*.5,-h*1.25-lift*.4)} ${P(w,-lift)}`;
    const cid=`${R.id}-eye${i}`;
    // sombra de ojos
    if(S.shadow&&S.shadow!=='none'){
      out+=pth(`M${P(-w,0)} C${P(-w*.4,-h*2.6)} ${P(w*.7,-h*2.5)} ${P(w+3,-lift-3)} C${P(w*.5,-h*1.25-lift*.4)} ${P(-w*.4,-h*1.3)} ${P(-w,0)}Z`,S.shadow,.6,`filter="url(#${R.id}-soft)"`);
    }
    let e=`<clipPath id="${cid}"><path d="${shape}"/></clipPath>`;
    e+=pth(shape,'#fbf8f6');

function bumpy(cx,cy,rx,ry,n,amp,a0=0,a1=Math.PI*2,move=true){
  const pts=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;pts.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)])}
  let d=move?`M${pts[0].map(v=>v.toFixed(1))}`:`L${pts[0].map(v=>v.toFixed(1))}`;
  for(let i=1;i<pts.length;i++){const a=a0+(a1-a0)*(i-.5)/n;d+=`Q${(cx+rx*amp*Math.cos(a)).toFixed(1)},${(cy+ry*amp*Math.sin(a)).toFixed(1)} ${pts[i].map(v=>v.toFixed(1))}`}
  return d;
}

/* =========================================================

   ========================================================= */
function scene(S,id='m',o={}){
  const R=new Reg(id);
  const get=k=>S[k]&&ITEM[S[k].id]?{it:ITEM[S[k].id],c:S[k].c,p:S[k].p}:null;
  const dr=k=>{const x=get(k);return x?x.it.draw(x.c,x.p,R):{u:'',o:''}};
  const shI=get('shoes')?.it;
  const T=dr('top'),B=dr('bottom'),D=dr('dress'),O=dr('outer'),SH=dr('shoes'),HD=dr('head'),EA=dr('ears'),NE=dr('neck'),EY=dr('eyesAcc'),BG2=dr('bag');
  const H=HAIR[S.hair]||HAIR.ondas;
  let s='';
  if(o.bg!==false)s+=(BG[S.bg]||BG.estudio).draw()+`<ellipse cx="200" cy="810" rx="78" ry="11" fill="#000" opacity=".16"/>`;
  s+=`<g class="${o.anim?'breathe':''}">`;
  s+=H.back(S.hairC,R);
  s+=bodyBase(S,R,{feet:!shI||shI.foot});
  if(shI&&!shI.top)s+=SH.u;
  s+=B.u;
  if(shI&&shI.top)s+=SH.u;
  s+=D.u+T.u+O.u+NE.u;
  s+=arms(S,R);
  s+=D.o+T.o+O.o;
  s+=head(S,R,o.anim);
  s+=H.front(S.hairC,R);
  s+=EA.u+EY.u+HD.u+BG2.u;
  s+='</g>';
  return`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${o.vb||'-40 0 480 830'}" ${o.attrs||''}><defs>${staticDefs(id)}${R.defs()}</defs>${s}</svg>`;
}

function pop(f=620){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(f,AC.currentTime);o.frequency.exponentialRampToValueAtTime(f*1.8,AC.currentTime+.08);g.gain.setValueAtTime(.12,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.16);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+.17)}catch(e){}}

function drawColorBar(){
  const T=TABS.find(t=>t.id===tab),cb=$('#cbar');

  cb.hidden=false;
  cb.innerHTML=`<div class="lbl"><span>Color de: ${it.name}</span>${worn.length>1?`<span class="chips">${worn.map(k=>`<button class="chip ${k===editSlot?'on':''}" data-es="${k}">${ITEM[S[k].id].name}</button>`).join('')}</span>`:''}</div>

}

let photoImg=null,pickKey='skin';
function mountPhoto(){
  const w=$('#photoWrap');w.innerHTML='';const cv=document.createElement('canvas');
  const max=Math.min(w.clientWidth||360,520),r=Math.min(1,max/photoImg.width);
  cv.width=photoImg.width*r;cv.height=photoImg.height*r;cv.getContext('2d').drawImage(photoImg,0,0,cv.width,cv.height);
  cv.addEventListener('click',e=>{
    const b=cv.getBoundingClientRect(),x=(e.clientX-b.left)*cv.width/b.width,y=(e.clientY-b.top)*cv.height/b.height;
    const d=cv.getContext('2d').getImageData(Math.max(0,x-3),Math.max(0,y-3),7,7).data;let r=0,g=0,bb=0,n=0;
    for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];bb+=d[i+2];n++}
    const c=rgb2hex(r/n,g/n,bb/n);
    change(()=>S[pickKey]=c,{panel:false});
    toast('Color copiado ✓');
  });
  w.appendChild(cv);
}

/* eventos */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  const d=t.dataset;
  if(d.t){tab=d.t;drawPanel();pop(500);$('#pbody').scrollTop=0;return}
  if(d.k&&d.v!==undefined){const k=d.k,v=d.v;
    if(k==='itemC')change(()=>S[editSlot].c=v);else change(()=>S[k]=v);return}
  if(d.tg){change(()=>S[d.tg]=!S[d.tg]);return}
  if(d.hair){change(()=>S.hair=d.hair);return}
  if(d.bg){change(()=>S.bg=d.bg);return}
  if(d.es){editSlot=d.es;drawColorBar();return}
  if(d.pat){change(()=>S[editSlot].p=d.pat);return}
  if(d.pick){pickKey=d.pick;drawPanel();return}
  if(d.item){const it=ITEM[d.item];
    change(()=>{
      if(S[it.slot]&&S[it.slot].id===it.id){S[it.slot]=null;return}
      const prev=S[it.slot];
      S[it.slot]={id:it.id,c:it.c,p:it.p||'none'};
      if(it.slot==='dress'){S.top=null;S.bottom=null}
      if(it.slot==='top'||it.slot==='bottom')S.dress=null;
      editSlot=it.slot;
    });return}
  if(d.load!==undefined){const looks=JSON.parse(localStorage.getItem('estudio_looks')||'[]');change(()=>Object.assign(S,looks[+d.load]));toast('Look cargado ✨');return}
  if(d.del!==undefined){const looks=JSON.parse(localStorage.getItem('estudio_looks')||'[]');looks.splice(+d.del,1);localStorage.setItem('estudio_looks',JSON.stringify(looks));drawPanel();return}
  if(t.id==='bSave2')saveLook();
  if(t.id==='bReset'){change(()=>AVATAR_KEYS.forEach(k=>S[k]=DEFAULT[k]));toast('Avatar original ✓')}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.r){S[t.dataset.r]=+t.value;drawStage(false)}
  if(t.type==='color'&&t.dataset.k){const k=t.dataset.k;if(k==='itemC')S[editSlot].c=t.value;else S[k]=t.value;drawStage(false)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.r||(t.type==='color'&&t.dataset.k)){snap();save();drawPanel()}
  if(t.id==='photoIn'&&t.files[0]){const img=new Image();img.onload=()=>{photoImg=img;drawPanel();toast('Ahora toca tu piel en la foto')};img.src=URL.createObjectURL(t.files[0])}
});
// guarda el valor previo antes de arrastrar un slider/selector de color (para deshacer)
document.addEventListener('pointerdown',e=>{if(e.target.matches('input[type=range],input[type=color]'))e.target._pre=JSON.stringify(S)},true);
document.addEventListener('change',e=>{if(e.target._pre){hist[hist.length-1]=e.target._pre;e.target._pre=null}},true);

$('#bUndo').onclick=()=>{if(!hist.length){toast('Nada que deshacer');return}S=JSON.parse(hist.pop());save();drawStage(true);drawPanel();pop(400)};
$('#bClear').onclick=()=>change(()=>SLOTS.forEach(k=>S[k]=null));
$('#bRand').onclick=()=>change(()=>{
  const r=a=>a[Math.floor(Math.random()*a.length)],by=s=>ITEMS.filter(i=>i.slot===s);
  const fabP=()=>Math.random()<.3?r(['dots','rayas','cuadros','flores','brillos','leopardo']):'none';
  const pick=s=>{const it=r(by(s));return{id:it.id,c:r(CLOTH_COLORS),p:it.fab?fabP():'none'}};
  SLOTS.forEach(k=>S[k]=null);
  if(Math.random()<.35)S.dress=pick('dress');else{S.top=pick('top');S.bottom=pick('bottom')}
  if(Math.random()<.4)S.outer=pick('outer');
  S.shoes=pick('shoes');
  ['head','ears','neck','eyesAcc','bag'].forEach(k=>{if(Math.random()<.4){const it=r(by(k));S[k]={id:it.id,c:it.c,p:'none'}}});
  S.bg=r(Object.keys(BG));S.lip=r(LIPS);
},{sound:false})||pop(800);
function saveLook(){let looks=[];try{looks=JSON.parse(localStorage.getItem('estudio_looks')||'[]')}catch(e){}looks.unshift(JSON.parse(JSON.stringify(S)));looks=looks.slice(0,24);try{localStorage.setItem('estudio_looks',JSON.stringify(looks))}catch(e){}toast('Look guardado ⭐');pop(900);if(tab==='looks')drawPanel()}
$('#bSave').onclick=saveLook;
$('#bShare').onclick=async()=>{
  const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  const url=location.href.split('#')[0]+'#l='+code;history.replaceState(null,'','#l='+code);
  try{await navigator.clipboard.writeText(url);toast('Enlace copiado 🔗')}catch(e){prompt('Copia este enlace:',url)}
};
$('#bPng').onclick=()=>{
  const svg=scene(S,'x',{attrs:'width="960" height="1660"'});
  const img=new Image();const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
  img.onload=()=>{const c=document.createElement('canvas');c.width=960;c.height=1660;c.getContext('2d').drawImage(img,0,0,960,1660);URL.revokeObjectURL(url);
    c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mi-look.png';a.click();toast('Foto descargada 📸')},'image/png')};
  img.src=url;
};
$('#mute').onclick=()=>{muted=!muted;$('#mute').textContent=muted?'🔇':'🔊';try{localStorage.setItem('estudio_mute',muted?'1':'0')}catch(e){}};
$('#mute').textContent=muted?'🔇':'🔊';

drawStage();drawPanel();
</script>
</body>
</html>
